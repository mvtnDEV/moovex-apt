# Entorno local: app + PostgreSQL. NO PROBADO aún.
# Uso: copiar a la raíz de sendflow, crear .env desde .env.example y ejecutar `docker compose up --build`.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: moovex
      POSTGRES_PASSWORD: moovex
      POSTGRES_DB: moovex
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moovex"]
      interval: 5s
      retries: 10

  migrate:
    build: .
    command: sh -c "npx prisma migrate deploy && npm run db:seed"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://moovex:moovex@db:5432/moovex
      DIRECT_URL: postgresql://moovex:moovex@db:5432/moovex
    depends_on:
      db: { condition: service_healthy }

  app:
    build: .
    ports: ["3000:3000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://moovex:moovex@db:5432/moovex
      DIRECT_URL: postgresql://moovex:moovex@db:5432/moovex
      NEXTAUTH_URL: http://localhost:3000
      APP_URL: http://localhost:3000
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
