# Entorno local: app + PostgreSQL. NO PROBADO aún.
# Uso: copiar a la raíz de sendflow, crear .env desde .env.example, agregar en .env una
# POSTGRES_PASSWORD propia (obligatoria, sin valor por defecto) y ejecutar `docker compose up --build`.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: moovex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: moovex
    # La BD no se publica al host: solo la app la alcanza por la red interna de Docker.
    # Para inspeccionarla desde el host use: ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moovex"]
      interval: 5s
      retries: 10

  migrate:
    build: .
    command: sh -c "npx prisma migrate deploy && npm run db:seed"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://moovex:${POSTGRES_PASSWORD}@db:5432/moovex
      DIRECT_URL: postgresql://moovex:${POSTGRES_PASSWORD}@db:5432/moovex
    depends_on:
      db: { condition: service_healthy }

  app:
    build: .
    ports: ["127.0.0.1:3000:3000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://moovex:${POSTGRES_PASSWORD}@db:5432/moovex
      DIRECT_URL: postgresql://moovex:${POSTGRES_PASSWORD}@db:5432/moovex
      NEXTAUTH_URL: http://localhost:3000
      APP_URL: http://localhost:3000
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
